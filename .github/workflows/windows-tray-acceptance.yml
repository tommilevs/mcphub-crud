name: Windows installed tray acceptance

on:
  workflow_dispatch:
    inputs:
      installerRunId:
        description: Successful Windows installer run containing the retained artifact
        required: true
        default: '40193083656'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  tray:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Reuse the exact bundle that passed full installation; do not rebuild it.
      - uses: actions/download-artifact@v4
        with:
          name: MCPHub-Windows-tested-installer
          run-id: ${{ inputs.installerRunId }}
          github-token: ${{ github.token }}
          path: tested-installer
      - name: Verify exact installed dashboard window and close behavior
        shell: pwsh
        run: ./native/test-nsis-ci-windows.ps1 -InstallerPath tested-installer/MCPHub_1.1.8_x64-setup.exe -CheckTray
