name: PostgreSQL integration

on:
  push:
    branches: [main, develop, feat/tool-result-history]
    paths:
      - '.github/workflows/history-postgres.yml'
      - 'tests/integration/*postgres.test.ts'
      - 'tests/integration/mcp-apps-openapi-routing.test.ts'
      - 'src/**'
  pull_request:
    paths:
      - '.github/workflows/history-postgres.yml'
      - 'tests/integration/*postgres.test.ts'
      - 'tests/integration/mcp-apps-openapi-routing.test.ts'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          # Public synthetic test credential, never a production access secret.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcphub_history_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d mcphub_history_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MCPHUB_ATTRIBUTION_TEST_HOST: 127.0.0.1
      MCPHUB_ATTRIBUTION_TEST_PORT: '5432'
      MCPHUB_ATTRIBUTION_TEST_USER: postgres
      MCPHUB_ATTRIBUTION_TEST_PASSWORD: postgres
      MCPHUB_ATTRIBUTION_TEST_DB: mcphub_history_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate
          pnpm install --frozen-lockfile
      - name: Enable vector extension in the disposable database
        run: |
          node -e "const {Client}=require('pg');(async()=>{const db=new Client({host:process.env.MCPHUB_ATTRIBUTION_TEST_HOST,user:process.env.MCPHUB_ATTRIBUTION_TEST_USER,password:process.env.MCPHUB_ATTRIBUTION_TEST_PASSWORD,database:process.env.MCPHUB_ATTRIBUTION_TEST_DB});try{await db.connect();await db.query('CREATE EXTENSION IF NOT EXISTS vector')}finally{await db.end()}})().catch(error=>{console.error(error);process.exitCode=1})"
      - name: Verify history, attribution, reviewed evidence and dataset storage
        run: pnpm exec jest --runInBand tests/integration/history-search-postgres.test.ts tests/integration/history-retention-postgres.test.ts tests/integration/attribution-postgres.test.ts tests/integration/mcp-apps-openapi-routing.test.ts
