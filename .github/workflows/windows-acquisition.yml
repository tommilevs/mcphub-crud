name: Windows acquisition acceptance

on:
  workflow_dispatch:
  push:
    branches: [feat/tool-result-history]
    paths: ['.github/workflows/windows-acquisition.yml', 'native/test-acquisition-windows.ps1', 'native/tests/acquisition-fixture/**', 'tests/integration/acquisition-native-windows.test.ts']

permissions:
  contents: read

jobs:
  acquisition:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build native service
        run: ./native/build-windows.ps1 -Action service
      - name: Verify offline acquisition with isolated SCM and PostgreSQL
        timeout-minutes: 6
        run: ./native/test-acquisition-windows.ps1
