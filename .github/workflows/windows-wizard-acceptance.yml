name: Windows installer wizard acceptance

on:
  workflow_dispatch:
    inputs:
      installerRunId:
        description: Successful installer run containing the retained artifact
        required: true
        default: '40193083656'
        type: string
  push:
    branches: [feat/tool-result-history]
    paths: ['.github/workflows/windows-wizard-acceptance.yml']

permissions:
  contents: read
  actions: read

jobs:
  wizard:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MCPHub-Windows-tested-installer
          run-id: ${{ inputs.installerRunId || '40193083656' }}
          github-token: ${{ github.token }}
          path: tested-installer
      - name: Verify interactive wizard with button-only diagnostics
        shell: pwsh
        run: ./native/test-nsis-ci-windows.ps1 -InstallerPath tested-installer/MCPHub_1.1.8_x64-setup.exe -CheckWizard -CheckTray
