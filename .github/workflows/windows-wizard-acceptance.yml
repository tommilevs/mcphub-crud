name: Windows installer wizard acceptance

on:
  workflow_dispatch:
    inputs:
      installerRunId:
        description: Successful installer run containing the retained artifact
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  wizard:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MCPHub-Windows-tested-installer
          run-id: ${{ inputs.installerRunId }}
          github-token: ${{ github.token }}
          path: tested-installer
      - name: Verify wizard completion and exact dashboard close request
        shell: pwsh
        run: ./native/test-nsis-ci-windows.ps1 -InstallerPath tested-installer/MCPHub_1.1.8_x64-setup.exe -CheckWizard -CheckTray
